<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Personal Cabinet</title>
    <link rel="stylesheet" href="styleHW6_1.css">

</head>
<body>
<div class="wrapper">
    <h1>Вхід в особистий кабінет</h1>
    <form class="login_form">
        <label>
            <input type="email" placeholder="Логін або email" required>
        </label>
        <label>
            <input type="password" placeholder="Пароль" required>
        </label>
        <div class="container">
            <div><label for="checkbox">Запам'ятати мене</label>
                <input type="checkbox" id="checkbox"></div>

            <div><label for="entrance"></label>
                <input type="submit" id="entrance" value="Вхід"></div>
        </div>
    </form>
</div>
</body>
</html>
